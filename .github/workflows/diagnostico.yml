
name: Diagnostico ObjectARX 2022

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: windows-2022

    steps:
      - name: Verificar Visual Studio y toolsets
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere -latest -products * -property installationPath

          Write-Host "Visual Studio: $vs"

          $vc = Join-Path $vs "VC\Tools\MSVC"

          Write-Host "`nVersiones MSVC instaladas:"
          Get-ChildItem $vc -Directory | Select-Object Name

          Write-Host "`nComprobando toolset v142:"
          $v142 = Join-Path $vs "VC\Tools\MSVC\14.29.30133"

          if (Test-Path $v142) {
              Write-Host "v142 encontrado"
          } else {
              Write-Host "v142 NO encontrado"
          }

          Write-Host "`nComprobando MSBuild:"
          $msbuild = Join-Path $vs "MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild -version

      - name: Verificar disponibilidad de MSVC
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where cl
          cl
